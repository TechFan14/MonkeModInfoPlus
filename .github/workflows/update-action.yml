name: Check for Mod Updates

on:
  push:
    branches:
      - master
  schedule:
    - cron: '5-59/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Check for Mod Updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for updates
        run: node app.js
        env:
          SECRET: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit latest release versions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- modinfo.json; then
            git add modinfo.json
            git commit -m "Update modinfo.json"
            git push
          fi
