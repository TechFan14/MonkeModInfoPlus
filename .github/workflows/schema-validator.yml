name: Validate JSON

on:
  push:
    paths:
      - 'mods.json'
      - 'mods.schema.json'
  pull_request:
    paths:
      - 'mods.json'
      - 'mods.schema.json'
  workflow_dispatch:

jobs:
  verify-json-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        uses: docker://orrosenblatt/validate-json-action:latest
        env:
          INPUT_SCHEMA: ./mods.schema.json
          INPUT_JSONS: ./mods.json
